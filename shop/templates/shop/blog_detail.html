{% extends "_base.html" %}
{% load static %}
{% block title %}{{ post.title }} — ProData d.o.o.{% endblock %}

{% block content %}
<main class="container-xl py-5">
  {% if post.image %}
  <div style="aspect-ratio:16/7;border-radius:16px;overflow:hidden;margin-bottom:32px;">
    <img src="{{ post.image.url }}" alt="{{ post.title }}" style="width:100%;height:100%;object-fit:cover;">
  </div>
  {% endif %}

  <span class="pd-blog-date">{{ post.date }}</span>
  <h1 class="pd-page-title">{{ post.title }}</h1>
  <p style="font-size:16px;color:var(--pd-muted);margin-bottom:32px;">{{ post.excerpt }}</p>
  <div style="font-size:15px;line-height:1.8;color:var(--pd-ink);">
    {{ post.content|linebreaks }}
  </div>
</main>
{% endblock %}
